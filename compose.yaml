services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${APP_HOST:?Set APP_HOST in .env}
    volumes:
      - workspace:/app/data
    expose:
      - "3000"
    stop_grace_period: 5m
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  workspace:
  caddy_data:
  caddy_config:
