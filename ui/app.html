const VERDICT_GLYPH = { SCALE:'▲', KILL:'✕', HOLD:'▬', ITERATE:'↻', EQUIVALENT:'≡', BLOCKED:'⊘' };
const VERDICT_TONE = { SCALE:'good', KILL:'crit', HOLD:'neutral', ITERATE:'warn', EQUIVALENT:'neutral', BLOCKED:'crit' };
const POLICY_TONE = { PASS:'good', WARN:'warn', BLOCK:'crit' };
const STATUS_TONE = { running:'good', degraded:'warn', halted:'crit', blocked:'crit' };

function pill(text, tone, glyph) {
  return `<span class="pill ${tone}">${glyph ? `<span class="glyph">${glyph}</span>` : ''}${esc(text)}</span>`;
}
function tuple(spec) {
  const parts = [
    `objective            = ${spec.objective}`,
    `destination_type     = ${spec.destinationType === undefined ? '(omitted — deliberate)' : spec.destinationType}`,
    `optimization_goal    = ${spec.optimizationGoal}`,
    `billing_event        = ${spec.billingEvent}`,
    `promoted_object      = ${spec.promotedObject}`,
  ];
  return parts.join('\n');
}

/* ------------------------------------------------------------ 01 Overview */
function renderOverview() {
  const open = ESCALATIONS.length;
  const crit = ESCALATIONS.filter((e) => e.sev === 'critical').length;
  const liveAds = BRANDS.reduce((a, b) => a + b.liveAds, 0);
  const pausedTotal = BRANDS.reduce((a, b) => a + b.pausedByMeta, 0);
  const dec = { SCALE:0, HOLD:0, KILL:0, ITERATE:0, EQUIVALENT:0 };
  let gated = 0;
  BRANDS.forEach((b) => { Object.keys(dec).forEach((k) => { dec[k] += b.decisions[k]; }); gated += b.gatedHolds; });
  const spendByCur = {};
  BRANDS.forEach((b) => {
    const c = brandCur(b);
    spendByCur[c.code] = spendByCur[c.code] || { spent:0, envelope:0, sym:c.symbol, offset:c.offset };
    spendByCur[c.code].spent += b.spendTodayMinor;
    spendByCur[c.code].envelope += b.spend.dailyBudgetMinor;
  });
  const spendCells = Object.keys(spendByCur).map((code) => {
    const s = spendByCur[code];
    return `<span class="mono">${s.sym}${nf(s.spent / s.offset, 2)}</span><span class="dim mono"> / ${s.sym}${nf(s.envelope / s.offset, 2)} ${code}</span>`;
  }).join('<br>');

  const escHtml = ESCALATIONS.map((e) => {
    const b = e.brandId ? brandById(e.brandId) : null;
    return `
    <div class="esc"><div class="esc-row" style="--sev:${SEV_VAR[e.sev]}">
      <div class="esc-stripe"></div>
      <div class="esc-main">
        <div class="esc-top">
          ${pill(e.sev === 'critical' ? 'Critical' : 'Warning', e.sev === 'critical' ? 'crit' : 'warn')}
          <span class="esc-title">${esc(e.title)}</span>
          <span class="esc-meta">${esc(e.age)} · since ${esc(e.since)}</span>
        </div>
        <div class="small mono dim" style="margin-bottom:5px">${esc(e.code)} · ${b ? esc(b.name) : 'all brands'}</div>
        <div class="esc-detail small">${esc(e.detail)}</div>
        <div class="esc-ask"><span class="label">What it needs from you</span>${esc(e.ask)}</div>
        <div class="esc-foot">${e.blocks.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>
      </div>
    </div></div>`;
  }).join('');

  const rows = BRANDS.map((b) => {
    const c = brandCur(b);
    const envelope = b.spend.dailyBudgetMinor;
    const trackMax = envelope * 1.75;
    const pct = Math.min(100, (b.spendTodayMinor / trackMax) * 100);
    const share = b.spendTodayMinor / envelope;
    const fillTone = b.status === 'halted' || b.status === 'blocked' ? 'crit' : (share > 1 ? 'warn' : 'good');
    const decChips = ['SCALE','KILL','ITERATE','EQUIVALENT','HOLD']
      .filter((k) => b.decisions[k] > 0)
      .map((k) => `<span class="chip"><span class="v">${VERDICT_GLYPH[k]} ${b.decisions[k]}</span> ${k.toLowerCase()}</span>`)
      .join('') || '<span class="dim small">no decisions — nothing delivered</span>';
    return `
    <tr>
      <td>
        <div style="font-weight:600">${esc(b.name)}</div>
        <div class="mono tiny dim">${esc(b.id)} · ${esc(b.adAccountId)}</div>
      </td>
      <td class="nowrap">
        ${pill(b.status, STATUS_TONE[b.status])}
        <div class="tiny dim" style="margin-top:3px;max-width:22ch">${esc(b.statusText)}</div>
      </td>
      <td style="min-width:210px">
        <div class="mono small"><b>${c.symbol}${nf(b.spendTodayMinor / c.offset, 2)}</b> <span class="dim">of ${c.symbol}${nf(envelope / c.offset, 2)}</span></div>
        <div class="meter" style="margin-top:5px">
          <i class="${fillTone}" style="width:${pct.toFixed(1)}%"></i>
          <b style="left:57.1%"></b><b class="dash" style="left:100%"></b>
        </div>
        <div class="meter-legend"><span>envelope at the solid tick</span><span>175% overdelivery ceiling at the dashed</span></div>
      </td>
      <td class="r num">${b.liveAds}${b.pausedByMeta ? `<div class="tiny" style="color:var(--crit)">${b.pausedByMeta} paused by Meta</div>` : ''}</td>
      <td>${decChips}${b.gatedHolds ? `<div class="tiny dim" style="margin-top:2px">${b.gatedHolds} of the holds never reached a statistic — a gate stopped them</div>` : ''}</td>
      <td class="r num">${ESCALATIONS.filter((e) => e.brandId === b.id).length}</td>
    </tr>`;
  }).join('');

  return `
  <div class="screen-head">
    <h1>Overview</h1>
    <p class="lede">What the system did with your money in the last 24 hours, and what it cannot proceed without.
      Figures are demo data; no live ad account is connected.</p>
  </div>

  <div class="grid-3" style="margin-bottom:16px">
    <div class="kpi ${crit ? 'is-crit' : ''}">
      <div class="label">Escalations open</div>
      <div class="v">${open} <small>· ${crit} critical</small></div>
      <div class="sub">Publishing is halted while any critical escalation stands</div>
    </div>
    <div class="kpi">
      <div class="label">Spend today vs envelope</div>
      <div class="v" style="font-size:15px;line-height:1.45">${spendCells}</div>
      <div class="sub">Not converted across currencies — an FX rate would be invented</div>
    </div>
    <div class="kpi">
      <div class="label">Ads live</div>
      <div class="v">${liveAds} <small>· ${pausedTotal} paused by Meta</small></div>
      <div class="sub">Across ${BRANDS.length} brands and ${BRANDS.reduce((a, b) => a + b.adSets, 0)} ad sets</div>
    </div>
    <div class="kpi">
      <div class="label">Decisions, last 24h</div>
      <div class="v">${dec.SCALE + dec.HOLD + dec.KILL + dec.ITERATE + dec.EQUIVALENT}</div>
      <div class="sub">${dec.SCALE} scale · ${dec.KILL} kill · ${dec.ITERATE} iterate · ${dec.EQUIVALENT} equivalent · ${dec.HOLD} hold (${gated} gated)</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Escalation queue</h2>
      <span class="dim small">the system stopped and is asking — everything here is blocking something</span>
      <span class="spacer"></span>
      ${pill(`${crit} critical`, 'crit')} ${pill(`${open - crit} warning`, 'warn')}
    </div>
    <div class="panel-body tight">${escHtml}</div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Brands</h2><span class="dim small">spend against envelope, delivery, and what was decided</span></div>
    <div class="panel-body tight scroll-x">
      <table class="grid">
        <thead><tr>
          <th>Brand</th><th>State</th><th>Spend today</th><th class="r">Live ads</th>
          <th>Decided in the last 24h</th><th class="r">Escalations</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Loop status</h2></div>
    <div class="panel-body">
      <div class="note-block plain">
        The measure → decide → act loop last completed at <span class="mono">06:00 UTC</span> against Insights that were
        already <span class="mono">7h 19m</span> stale, because the access token died at 22:41 the night before. It ran
        anyway and produced only gated HOLDs, which is the correct behaviour: a decision layer that cannot see fresh rows
        refuses rather than guessing. Nothing was published, no budget was written except one queued step, and no ad was
        paused by this system today.
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------ 02 Brands */
function renderBrands() {
  const cards = BRANDS.map((b) => {
    const spec = ARCHETYPES[b.archetype];
    const c = brandCur(b);
    const unverified = spec.confidence === 'inferred';
    const restricted = b.specialAdCategories.filter((x) => ['HOUSING','EMPLOYMENT','CREDIT','FINANCIAL_PRODUCTS_SERVICES'].indexOf(x) >= 0);
    const dest = Object.keys(b.destination).map((k) => `<div class="chip"><span class="k">${esc(k)}</span><span class="v">${esc(b.destination[k])}</span></div>`).join('');
    const problems = [];
    if (restricted.length) problems.push(`${restricted.join(', ')} silently rewrites targeting: age forced to 18-65+, no gender selection, no location exclusion, 15-mile minimum radius, no lookalikes.`);
    if (!b.claims.likenessRightsConfirmed) problems.push('likenessRightsConfirmed is false — the pipeline will refuse to generate any human presenter for this brand.');
    if (b.pageId === '—') problems.push('No Page assigned. This archetype promotes a page object, so nothing can be created.');
    return `
    <div class="panel">
      <div class="panel-head">
        <h2>${esc(b.name)}</h2>
        <span class="mono tiny dim">${esc(b.id)}</span>
        <span class="spacer"></span>
        ${pill(b.archetype, unverified ? 'warn' : 'accent')}
        ${unverified ? pill('tuple unverified', 'warn') : pill('tuple documented', 'good')}
      </div>
      <div class="panel-body">
        <p class="small muted" style="max-width:80ch">${esc(b.proposition)}</p>
        <div class="grid-2">
          <div>
            <div class="label">Resolved Meta tuple</div>
            <pre class="tuple" style="white-space:pre-wrap">${esc(tuple(spec))}</pre>
            <div class="${unverified ? 'note-block' : 'note-block plain'}" style="font-size:12px">
              <b>${unverified ? 'UNVERIFIED — ' : 'Documented. '}</b>${esc(spec.note)}
            </div>
            <div class="label" style="margin-top:12px">Destination (promoted_object = ${esc(spec.promotedObject)})</div>
            <div>${dest}</div>
            <div class="label" style="margin-top:10px">Identity</div>
            <div>
              <span class="chip"><span class="k">page</span><span class="v">${esc(b.pageId)}</span></span>
              <span class="chip"><span class="k">ad account</span><span class="v">${esc(b.adAccountId)}</span></span>
              ${b.instagramUserId ? `<span class="chip"><span class="k">ig user</span><span class="v">${esc(b.instagramUserId)}</span></span>`
                : '<span class="chip"><span class="k">ig user</span><span class="v">page-backed fallback</span></span>'}
              <span class="chip"><span class="k">countries</span><span class="v">${b.countries.join(', ')}</span></span>
            </div>
          </div>
          <div>
            <div class="label">Spend envelope <span class="dim">(minor units, ${esc(c.code)})</span></div>
            <table class="grid" style="margin-bottom:10px">
              <tbody>
                <tr><td>dailyBudgetMinor</td><td class="r mono">${nf(b.spend.dailyBudgetMinor)}</td><td class="r mono dim">${c.symbol}${nf(b.spend.dailyBudgetMinor / c.offset, 2)}</td></tr>
                <tr><td>maxDailyBudgetMinor <span class="dim">hard ceiling</span></td><td class="r mono">${nf(b.spend.maxDailyBudgetMinor)}</td><td class="r mono dim">${c.symbol}${nf(b.spend.maxDailyBudgetMinor / c.offset, 2)}</td></tr>
                <tr><td>targetCpaMinor <span class="dim">sets the kill threshold</span></td><td class="r mono">${nf(b.spend.targetCpaMinor)}</td><td class="r mono dim">${c.symbol}${nf(b.spend.targetCpaMinor / c.offset, 2)}</td></tr>
                ${b.spend.contributionMarginMinor ? `<tr><td>contributionMarginMinor <span class="dim">sent as the CAPI event value</span></td><td class="r mono">${nf(b.spend.contributionMarginMinor)}</td><td class="r mono dim">${c.symbol}${nf(b.spend.contributionMarginMinor / c.offset, 2)}</td></tr>` : ''}
              </tbody>
            </table>
            <div class="label">Claim set — the only things it may assert</div>
            <div style="margin-bottom:6px">${b.claims.substantiated.map((x) => `<span class="chip incl"><span class="v">${esc(x)}</span></span>`).join('')}</div>
            <div class="label">Never say</div>
            <div style="margin-bottom:6px">${b.claims.neverSay.map((x) => `<span class="chip excl"><span class="v">${esc(x)}</span></span>`).join('')}</div>
            <div class="label">Never show</div>
            <div style="margin-bottom:6px">${b.claims.neverShow.map((x) => `<span class="chip excl"><span class="v">${esc(x)}</span></span>`).join('')}</div>
            <div>
              ${pill(`special ad category: ${b.specialAdCategories.join(', ')}`, restricted.length ? 'warn' : 'neutral')}
              ${pill(`likeness rights ${b.claims.likenessRightsConfirmed ? 'confirmed' : 'not confirmed'}`, b.claims.likenessRightsConfirmed ? 'good' : 'warn')}
            </div>
          </div>
        </div>
        ${problems.length ? `<hr class="rule"><div class="label" style="margin-bottom:6px">Config warnings</div>${problems.map((p) => `<div class="finding" style="--sev:var(--warn)"><div class="small">${esc(p)}</div></div>`).join('')}` : ''}
      </div>
    </div>`;
  }).join('');

  const matrix = Object.keys(ARCHETYPES).map((k) => {
    const s = ARCHETYPES[k];
    const inUse = BRANDS.filter((b) => b.archetype === k).map((b) => b.id);
    const un = s.confidence === 'inferred';
    return `<tr>
      <td class="nowrap"><span class="mono">${esc(s.archetype)}</span>${inUse.length ? `<div class="tiny dim">in use: ${inUse.join(', ')}</div>` : ''}</td>
      <td class="mono nowrap">${esc(s.objective)}</td>
      <td class="mono nowrap">${s.destinationType === undefined ? '<span class="dim">(omitted)</span>' : esc(s.destinationType)}</td>
      <td class="mono nowrap">${esc(s.optimizationGoal)}</td>
      <td class="mono nowrap">${esc(s.billingEvent)}</td>
      <td class="mono nowrap">${esc(s.promotedObject)}</td>
      <td class="nowrap">${un ? pill('unverified', 'warn') : pill('documented', 'good')}</td>
      <td style="min-width:30ch"><span class="tiny muted">${esc(s.note)}</span></td>
    </tr>`;
  }).join('');

  const unverifiedCount = Object.keys(ARCHETYPES).filter((k) => ARCHETYPES[k].confidence === 'inferred').length;

  return `
  <div class="screen-head">
    <h1>Brands</h1>
    <p class="lede">Per-brand configuration with the tuple each archetype actually resolves to. Nothing here is inferred at
      publish time — the tuple is data, and the ones resting on an assumption say so.</p>
  </div>
  ${cards}
  <div class="panel">
    <div class="panel-head">
      <h2>Archetype matrix</h2>
      <span class="dim small">the ODAX legality table, as the system holds it</span>
      <span class="spacer"></span>
      ${pill(`${unverifiedCount} of 9 unverified`, 'warn')}
    </div>
    <div class="panel-body tight scroll-x">
      <table class="grid">
        <thead><tr><th>Archetype</th><th>objective</th><th>destination_type</th><th>optimization_goal</th>
          <th>billing_event</th><th>promoted_object</th><th>Confidence</th><th>Note</th></tr></thead>
        <tbody>${matrix}</tbody>
      </table>
    </div>
  </div>`;
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------ 03 Funnel builder */
const FUNNEL_STATE = {
  goal:'sales', budgetMajor:240, targetCpaMajor:32, assets:'website_traffic',
  currency:'USD', warmPool:4200, purchases:180, warmTouched:true, purchasesTouched:true,
  valueSpread:false,
};

function funnelControls() {
  const goalBtns = Object.keys(EASY_GOAL_LABEL).map((g) =>
    `<button type="button" data-goal="${g}" aria-pressed="${FUNNEL_STATE.goal === g}">${esc(EASY_GOAL_LABEL[g])}</button>`).join('');
  const assetBtns = Object.keys(EASY_ASSETS_LABEL).map((a) =>
    `<button type="button" data-assets="${a}" aria-pressed="${FUNNEL_STATE.assets === a}">${esc(EASY_ASSETS_LABEL[a])}</button>`).join('');
  const sym = (CURRENCIES[FUNNEL_STATE.currency] || CURRENCIES.USD).symbol;
  return `
  <div class="panel">
    <div class="panel-head"><h2>Your answers</h2><span class="dim small">four questions; everything else is measured or derived</span></div>
    <div class="panel-body">
      <div class="field">
        <span class="label">1 · What do you want the ads to do?</span>
        <div class="seg" id="goal-seg">${goalBtns}</div>
      </div>
      <div class="field">
        <span class="label">2 · What have you got already?</span>
        <div class="seg" id="assets-seg">${assetBtns}</div>
        <div class="hint">This sets the starting assumptions below. It is the one input the system cannot measure at cold start.</div>
      </div>
      <div class="field">
        <span class="label">3 · Daily budget</span>
        <div class="budget-readout"><span id="budget-out">${sym}${nf(FUNNEL_STATE.budgetMajor, 2)}</span><span class="dim" style="font-size:14px">/day</span></div>
        <input type="range" id="budget-range" min="5" max="1500" step="5" value="${FUNNEL_STATE.budgetMajor}">
        <div class="ticks"><span>${sym}5</span><span>${sym}300</span><span>${sym}600</span><span>${sym}900</span><span>${sym}1,200</span><span>${sym}1,500</span></div>
        <div class="hint">Move it. The recommendation is allowed to change, and it will.</div>
        <div style="margin-top:8px" class="seg" id="budget-presets">
          ${[15,45,60,120,240,500,900].map((v) => `<button type="button" data-budget="${v}">${sym}${v}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <span class="label">4 · What is a conversion worth to you?</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label class="small muted">Target CPA
            <input type="number" id="cpa-in" min="1" max="900" step="1" value="${FUNNEL_STATE.targetCpaMajor}" style="width:90px">
          </label>
          <label class="small muted">Currency
            <select id="cur-in">${['USD','GBP','EUR'].map((x) => `<option ${x === FUNNEL_STATE.currency ? 'selected' : ''}>${x}</option>`).join('')}</select>
          </label>
        </div>
        <div class="hint">Target CPA is the cost basis for every brand_cpa rung, and the kill threshold for every verdict.</div>
      </div>
      <hr class="rule">
      <div class="label" style="margin-bottom:6px">Measured from the account</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <label class="small muted">30-day warm pool
          <input type="number" id="warm-in" min="0" max="500000" step="100" value="${FUNNEL_STATE.warmPool}" style="width:110px">
        </label>
        <label class="small muted">Conversions, last 180d
          <input type="number" id="purch-in" min="0" max="100000" step="10" value="${FUNNEL_STATE.purchases}" style="width:110px">
        </label>
      </div>
      <label class="checkline"><input type="checkbox" id="vs-in" ${FUNNEL_STATE.valueSpread ? 'checked' : ''}> Order value has a real spread (enables the value ladder)</label>
      <div class="hint">Blank these and the system assumes them from question 2 — and says so in the warnings, because the
        template choice turns on both.</div>
    </div>
  </div>`;
}

function stageCard(rs, assessment) {
  const s = rs.stage;
  const a = rs.arithmetic;
  const cur = CURRENCIES[FUNNEL_STATE.currency] || CURRENCIES.USD;
  const bad = a.problem !== undefined;
  const inclPools = rs.targetPools.map((p) => `<span class="chip incl"><span class="v">+</span>${esc(p.label)}</span>`).join('');
  const incl = inclPools || (s.advantageAudience === 1 ? '<span class="chip">broad — no hard inclusion</span>' : '');
  const sugg = rs.suggestPools.map((p) => `<span class="chip sugg"><span class="v">~</span>${esc(p.label)}</span>`).join('');
  const excl = rs.excludePools.map((p) => `<span class="chip excl"><span class="v">−</span>${esc(p.label)}</span>`).join('');
  return `
  <div class="stage ${bad ? 'is-bad' : ''}">
    <div class="stage-top">
      <span class="pill neutral">campaign ${esc(s.campaign)}</span>
      <h4>${esc(s.label)}</h4>
    </div>
    <div class="stage-body">
      <div>
        <div class="small dim" style="margin-bottom:4px">${esc(s.role)} · ${esc(s.budgetLevel)} budget · ${pctS(s.budgetShare)} of total</div>
        <div class="mono" style="font-size:19px;font-weight:600">${cur.symbol}${nf(rs.dailyBudgetMinor / cur.offset, 2)}<span class="dim" style="font-size:12px;font-weight:400">/day</span></div>
        <div style="margin:7px 0">
          ${pill(`optimise: ${a.rungLabel}`, bad ? 'crit' : 'accent')}
          ${a.laddered ? pill(`laddered down from ${RUNGS[a.preferredRung].label}`, 'warn') : ''}
          ${pill(`Advantage+ audience ${s.advantageAudience ? 'on' : 'off'}`, s.advantageAudience ? 'neutral' : 'warn')}
          ${s.maxDurationDays ? pill(`hard stop day ${s.maxDurationDays}`, 'warn') : ''}
        </div>
        <div class="small muted">${esc(s.purpose)}</div>
      </div>
      <div>
        <span class="label">Published as</span>
        <div class="tuple">${esc(tuple(rs.spec))}</div>
        ${incl ? `<div class="aud-group"><span class="label">Targets</span>${incl}</div>` : ''}
        ${sugg ? `<div class="aud-group"><span class="label">Suggestions inside Advantage+</span>${sugg}</div>` : ''}
        ${excl ? `<div class="aud-group"><span class="label">Excludes</span>${excl}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function arithmeticTable(assessment) {
  const cur = CURRENCIES[FUNNEL_STATE.currency] || CURRENCIES.USD;
  const rows = assessment.stages.map((a) => {
    const aff = a.eventsAffordablePerWeek;
    const ok = a.problem === undefined;
    const width = aff === undefined ? 100 : Math.min(100, (aff / 50) * 100);
    return `<tr>
      <td><b>${esc(a.label)}</b><div class="tiny dim">${pctS(a.budgetShare)} share · ${esc(a.rungLabel)}${a.laddered ? ` (down from ${RUNGS[a.preferredRung].label})` : ''}</div></td>
      <td class="r mono">${cur.symbol}${nf(a.stageDailyMajor, 2)}</td>
      <td class="r mono">${a.costPerEventMajor === undefined ? '—' : cur.symbol + nf(a.costPerEventMajor, 2)}</td>
      <td class="r mono">${aff === undefined ? 'n/a' : nf(aff, 1)}</td>
      <td class="r mono">${a.eventLimited ? 50 : '—'}</td>
      <td style="min-width:150px">
        ${a.eventLimited ? `<div class="arith-bar"><i class="${ok ? '' : 'short'}" style="width:${width.toFixed(1)}%"></i><b style="left:100%"></b></div>` : '<span class="tiny dim">not event-limited</span>'}
      </td>
      <td class="r mono">${a.stageFloorDailyMajor === undefined ? '—' : cur.symbol + nf(a.stageFloorDailyMajor, 2)}</td>
      <td class="nowrap">${ok ? pill('clears', 'good', '✓') : pill(a.exitsLearning ? 'below its floor role' : 'never exits learning', 'crit', '✕')}</td>
    </tr>`;
  }).join('');
  return `
  <div class="scroll-x">
    <table class="grid">
      <thead><tr>
        <th>Stage</th><th class="r">Daily</th><th class="r">Cost / event</th>
        <th class="r">Events/wk it buys</th><th class="r">Needs</th><th>vs the 50 it needs</th>
        <th class="r">Its own floor</th><th>Verdict</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderFunnelResult() {
  const cur = CURRENCIES[FUNNEL_STATE.currency] || CURRENCIES.USD;
  CUR = { code:FUNNEL_STATE.currency, symbol:cur.symbol, offset:cur.offset };
  const opts = {
    goal:FUNNEL_STATE.goal,
    dailyBudgetMinor: Math.round(FUNNEL_STATE.budgetMajor * cur.offset),
    currency:FUNNEL_STATE.currency, currencyOffset:cur.offset,
    targetCpaMinor: Math.round(FUNNEL_STATE.targetCpaMajor * cur.offset),
    assets:FUNNEL_STATE.assets,
    valueSpreadMaterial: FUNNEL_STATE.valueSpread,
  };
  if (FUNNEL_STATE.warmTouched) opts.warmPoolSize = FUNNEL_STATE.warmPool;
  if (FUNNEL_STATE.purchasesTouched) opts.purchasesLast180d = FUNNEL_STATE.purchases;

  const plan = resolveEasyOptions(opts);
  const a = plan.assessment;
  const refused = a.verdict === 'refuse';
  const downgraded = plan.recommendation.considered.filter((c) => c.verdict === 'refuse');

  let banner;
  if (refused) {
    banner = `<div class="banner crit"><div class="bar"></div><div class="body">
      <h3>No structure works at ${cur.symbol}${nf(FUNNEL_STATE.budgetMajor, 2)}/day for a ${cur.symbol}${nf(FUNNEL_STATE.targetCpaMajor, 2)} ${RUNGS[primaryRungFor(plan.archetype)].label.toLowerCase()}</h3>
      <p>Even ${esc(plan.template.name)} cannot clear the learning-phase floor. The arithmetic is below, and the honest
      answer is to raise the budget to about ${cur.symbol}${nf(a.requiredDailyMajor, 2)}/day, lower the target, or accept
      permanently unstable delivery.</p></div></div>`;
  } else if (downgraded.length) {
    banner = `<div class="banner warn"><div class="bar"></div><div class="body">
      <h3>Build ${esc(plan.template.name)} — not the ${esc(FUNNEL_TEMPLATES[downgraded[0].templateId].name)} this budget looks like it should buy</h3>
      <p>${esc(FUNNEL_TEMPLATES[downgraded[0].templateId].name)} was considered and refused: at
      ${cur.symbol}${nf(FUNNEL_STATE.budgetMajor, 2)}/day one of its stages cannot reach the 50 optimisation events a week
      Meta needs before it stops experimenting. Splitting the budget further would buy structure at the cost of the thing
      the structure is for.</p></div></div>`;
  } else {
    banner = `<div class="banner good"><div class="bar"></div><div class="body">
      <h3>Build ${esc(plan.template.name)}</h3>
      <p>Every stage clears its own learning-phase floor at ${cur.symbol}${nf(FUNNEL_STATE.budgetMajor, 2)}/day.
      ${esc(plan.template.who)}</p></div></div>`;
  }

  const flow = plan.stages.map((rs, i) =>
    (i ? '<div class="flow-arrow" aria-hidden="true"></div>' : '') + stageCard(rs, a)).join('');

  const consideredRows = plan.recommendation.considered.map((c) => `
    <tr>
      <td><b>${esc(FUNNEL_TEMPLATES[c.templateId].name)}</b><div class="tiny dim">${esc(FUNNEL_TEMPLATES[c.templateId].who)}</div></td>
      <td class="nowrap">${c.verdict === 'build' ? pill('built', 'good', '✓') : pill('refused', 'crit', '✕')}</td>
      <td class="small muted">${esc(c.why)}</td>
    </tr>`).join('');

  const declaredDelta = a.requiredDailyMajor - a.declaredMinViableDailyMajor;

  return `
  ${banner}

  <div class="panel">
    <div class="panel-head">
      <h2>${esc(plan.template.name)}</h2>
      <span class="dim small">${plan.stages.length} stage${plan.stages.length > 1 ? 's' : ''} ·
        ${new Set(plan.template.stages.map((s) => s.campaign)).size} campaign(s) ·
        ${cur.symbol}${nf(FUNNEL_STATE.budgetMajor, 2)}/day</span>
      <span class="spacer"></span>
      ${pill(`playbook floor ${money(a.declaredMinViableDailyMajor, cur)}`, 'neutral')}
      ${pill(`arithmetic floor ${money(a.requiredDailyMajor, cur)}`, refused ? 'crit' : 'accent')}
    </div>
    <div class="panel-body">
      <div class="flow">${flow}</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>The arithmetic</h2>
      <span class="dim small">events needed per ad set per week (50) versus events this budget buys at that stage's cost per event</span>
    </div>
    <div class="panel-body tight">${arithmeticTable(a)}</div>
    <div class="panel-body" style="border-top:1px solid var(--border)">
      <div class="label" style="margin-bottom:6px">In full, as the planner wrote it</div>
      ${a.explanation.map((l) => `<div class="arith-line">${esc(l)}</div>`).join('')}
      ${Math.abs(declaredDelta) > 0.5 ? `<div class="note-block" style="margin-top:10px">
        The playbook figure for ${esc(plan.template.name)} is ${money(a.declaredMinViableDailyMajor, cur)}/day; this brand's
        own cost per conversion makes the real floor ${money(a.requiredDailyMajor, cur)}/day. Both are shown because a
        disagreement between the research and the arithmetic is information, not an error to hide.
      </div>` : ''}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>What else was considered</h2><span class="dim small">every refusal, with the reason it was refused</span></div>
    <div class="panel-body tight scroll-x">
      <table class="grid"><thead><tr><th>Template</th><th>Outcome</th><th>Why</th></tr></thead><tbody>${consideredRows}</tbody></table>
    </div>
    ${plan.recommendation.notes.length ? `<div class="panel-body" style="border-top:1px solid var(--border)">
      ${plan.recommendation.notes.map((n) => `<div class="note-block plain" style="margin-bottom:8px">${esc(n)}</div>`).join('')}
    </div>` : ''}
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h2>Before anything publishes</h2></div>
      <div class="panel-body">
        <div class="label" style="margin-bottom:6px">Audiences to build</div>
        ${plan.audiencesToBuild.map((p) => `<div class="chip"><span class="v">${esc(p.kind)}</span>${esc(p.label)}${p.sizeGated ? ' · size-gated at 1,000' : ''}${p.undocumentedRule ? ' · undocumented rule' : ''}</div>`).join('')}
        <div class="label" style="margin-top:12px;margin-bottom:6px">Warnings</div>
        ${plan.warnings.length ? plan.warnings.map((w) => `<div class="finding" style="--sev:var(--warn)"><div class="small">${esc(w)}</div></div>`).join('')
          : '<div class="small dim">None — every input was measured rather than assumed.</div>'}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>How this template fails</h2></div>
      <div class="panel-body">
        <p class="small muted">${esc(plan.template.failureMode)}</p>
        <div class="label" style="margin:10px 0 6px">Collapse it when</div>
        <ul class="explain small">${plan.template.killCriteria.map((k) => `<li>${esc(k)}</li>`).join('')}</ul>
      </div>
    </div>
  </div>`;
}

function renderFunnel() {
  return `
  <div class="screen-head">
    <h1>Funnel builder</h1>
    <p class="lede">A few answers resolve to a structure — or to a refusal. Every stage in a funnel is an ad set that must
      buy about 50 optimisation events a week before Meta stops experimenting on it, so past a point, more structure means
      less learning. The builder will say so.</p>
  </div>
  <div class="funnel-layout">
    <div id="funnel-controls">${funnelControls()}</div>
    <div id="funnel-result">${renderFunnelResult()}</div>
  </div>`;
}

function wireFunnel() {
  const root = $('#screen-funnel');
  const redraw = (full) => {
    if (full) { $('#funnel-controls', root).innerHTML = funnelControls(); wireFunnel(); }
    $('#funnel-result', root).innerHTML = renderFunnelResult();
  };
  $$('#goal-seg button', root).forEach((btn) => {
    btn.onclick = () => {
      FUNNEL_STATE.goal = btn.dataset.goal;
      $$('#goal-seg button', root).forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      redraw(false);
    };
  });
  $$('#assets-seg button', root).forEach((btn) => {
    btn.onclick = () => {
      FUNNEL_STATE.assets = btn.dataset.assets;
      FUNNEL_STATE.warmTouched = false; FUNNEL_STATE.purchasesTouched = false;
      const warmDefaults = { nothing:0, video_views:0, website_traffic:1000, customers:1000 };
      FUNNEL_STATE.warmPool = warmDefaults[FUNNEL_STATE.assets];
      FUNNEL_STATE.purchases = FUNNEL_STATE.assets === 'customers' ? 100 : 0;
      redraw(true);
    };
  });
  const range = $('#budget-range', root);
  if (range) {
    range.oninput = () => {
      FUNNEL_STATE.budgetMajor = Number(range.value);
      const sym = (CURRENCIES[FUNNEL_STATE.currency] || CURRENCIES.USD).symbol;
      $('#budget-out', root).textContent = `${sym}${nf(FUNNEL_STATE.budgetMajor, 2)}`;
      redraw(false);
    };
  }
  $$('#budget-presets button', root).forEach((btn) => {
    btn.onclick = () => {
      FUNNEL_STATE.budgetMajor = Number(btn.dataset.budget);
      redraw(true);
    };
  });
  const cpa = $('#cpa-in', root);
  if (cpa) cpa.oninput = () => { const v = Number(cpa.value); if (v > 0) { FUNNEL_STATE.targetCpaMajor = v; redraw(false); } };
  const curIn = $('#cur-in', root);
  if (curIn) curIn.onchange = () => { FUNNEL_STATE.currency = curIn.value; redraw(true); };
  const warm = $('#warm-in', root);
  if (warm) warm.oninput = () => { FUNNEL_STATE.warmPool = Number(warm.value) || 0; FUNNEL_STATE.warmTouched = true; redraw(false); };
  const pur = $('#purch-in', root);
  if (pur) pur.oninput = () => { FUNNEL_STATE.purchases = Number(pur.value) || 0; FUNNEL_STATE.purchasesTouched = true; redraw(false); };
  const vs = $('#vs-in', root);
  if (vs) vs.onchange = () => { FUNNEL_STATE.valueSpread = vs.checked; redraw(false); };
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------ 04 Creative */
const GENOME_ORDER = [
  ['awarenessStage','awareness'], ['mechanic','mechanic'], ['hookTactic','hook tactic'],
  ['primaryTrigger','trigger 1'], ['secondaryTrigger','trigger 2'], ['template','template'],
  ['assetType','asset type'], ['spokespersonType','spokesperson'], ['pacing','pacing'],
  ['captionStyle','captions'], ['aspectRatio','ratio'], ['durationBucket','duration'],
  ['musicPresence','music'], ['dominantColour','colour'], ['emotionalRegister','register'],
  ['offerType','offer'], ['cta','cta'],
];
const CREATIVE_FILTER = { brandId:'all' };

function renderCreative() {
  const list = CREATIVES.filter((c) => CREATIVE_FILTER.brandId === 'all' || c.brandId === CREATIVE_FILTER.brandId);
  const cards = list.map((c) => {
    const b = brandById(c.brandId);
    const cur = brandCur(b);
    const p = c.perf;
    const genome = GENOME_ORDER.filter(([k]) => c.genome[k] !== undefined).map(([k, lbl]) =>
      `<span class="chip"><span class="k">${lbl}</span><span class="v">${esc(c.genome[k])}</span></span>`).join('');
    const findings = c.policy.findings.map((f) => `
      <div class="finding" style="--sev:var(--${POLICY_TONE[f.severity]})">
        <div><span class="fid">${esc(f.ruleId)}</span> ${pill(f.severity, POLICY_TONE[f.severity])}
          <span class="tiny dim">${esc(f.policy)}</span></div>
        ${f.span ? `<div class="tiny mono dim">match: ${esc(f.span)}</div>` : ''}
        <div class="small muted" style="margin-top:3px">${esc(f.message)}</div>
        <div class="small" style="margin-top:3px"><span class="label">Remedy</span> ${esc(f.remedy)}</div>
      </div>`).join('');
    const perfHtml = p ? `
      <div class="perf-row">
        <div><span class="label">Spend</span><span class="v">${cur.symbol}${nf(p.spendMinor / cur.offset, 2)}</span></div>
        <div><span class="label">Conversions</span><span class="v">${nf(p.conversions)}</span></div>
        <div><span class="label">CPA</span><span class="v" style="color:${p.cpaMinor > b.spend.targetCpaMinor ? 'var(--crit)' : 'var(--good)'}">${cur.symbol}${nf(p.cpaMinor / cur.offset, 2)}</span></div>
        <div><span class="label">Target</span><span class="v dim">${cur.symbol}${nf(b.spend.targetCpaMinor / cur.offset, 2)}</span></div>
        <div><span class="label">Impressions</span><span class="v">${nf(p.impressions)}</span></div>
        <div><span class="label">Age</span><span class="v">${p.ageDays}d</span></div>
      </div>
      <div>
        ${pill(`learning: ${p.learningStatus}`, p.learningStatus === 'SUCCESS' ? 'good' : (p.learningStatus === 'LEARNING' ? 'warn' : 'neutral'))}
        ${pill(`status: ${p.effectiveStatus}`, p.effectiveStatus === 'ACTIVE' ? 'neutral' : 'warn')}
        ${pill(`attribution: ${p.attributionSettings.join(', ')}`, 'neutral')}
        ${p.impressionsLast24h === 0 ? pill('0 impressions in 24h', 'crit') : pill(`${nf(p.impressionsLast24h)} impressions in 24h`, 'neutral')}
      </div>`
      : `<div class="note-block" style="margin:6px 0">Never delivered. It was stopped at the policy screen, so there is no
         performance to show — and no posterior was created, because a creative that never ran carries no evidence.</div>`;

    return `
    <div class="creative">
      <div class="cre-top">
        <div style="min-width:0;flex:1 1 320px">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            ${pill(c.verdict, VERDICT_TONE[c.verdict], VERDICT_GLYPH[c.verdict])}
            ${pill(`policy ${c.policy.verdict}`, POLICY_TONE[c.policy.verdict])}
            <span style="font-weight:600">${esc(b.name)}</span>
            <span class="dim small">angle: ${esc(c.angleId)}</span>
          </div>
          <div class="cre-id" style="margin-top:4px">${esc(c.name)}</div>
          <div class="cre-id">${esc(c.adId)}${c.adSetId !== '—' ? ` · ad set ${esc(c.adSetId)}` : ''}</div>
        </div>
      </div>
      <div class="cre-grid">
        <div>
          <div class="label">Hook</div>
          <div style="font-size:14.5px;margin-bottom:8px">${esc(c.hook)}</div>
          <div class="label">Angle</div>
          <div class="small muted" style="margin-bottom:8px">“${esc(c.angleStatement)}” — the angle is the entity the
            bandit runs over; this creative is one expression of it.</div>
          <div class="label" style="margin-bottom:4px">Genome</div>
          <div>${genome}</div>
          ${perfHtml}
        </div>
        <div>
          <div class="verdict-box ${c.verdict}">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
              ${pill(c.verdict, VERDICT_TONE[c.verdict], VERDICT_GLYPH[c.verdict])}
              ${c.ref ? `<span class="tiny mono dim">judged against ${esc(c.ref)}</span>` : '<span class="tiny mono dim">no reference ad</span>'}
            </div>
            <div class="verdict-plain">${esc(c.plain)}</div>
            <div class="raw-reason">${esc(c.reason)}</div>
            <div class="small" style="margin-top:8px"><span class="label">Action taken</span> ${esc(c.action)}</div>
          </div>
          ${findings ? `<div class="label" style="margin:12px 0 4px">Policy findings · ${c.policy.stagesRun}/7 stages ran</div>${findings}`
            : `<div class="label" style="margin:12px 0 4px">Policy</div>
               <div class="small muted">All 7 stages ran and found nothing. A PASS means no rule fired — it is not a
               guarantee Meta will approve it, and nothing in this system treats it as one.</div>`}
        </div>
      </div>
    </div>`;
  }).join('');

  const counts = {};
  CREATIVES.forEach((c) => { counts[c.verdict] = (counts[c.verdict] || 0) + 1; });

  return `
  <div class="screen-head">
    <h1>Creative</h1>
    <p class="lede">Every generated ad with the attributes it was built from, the policy screen it passed or failed, what it
      did, and the verdict — with the arithmetic behind the verdict in the words the decision layer used.</p>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2>Slate</h2>
      <span class="dim small">${CREATIVES.length} creatives across ${new Set(CREATIVES.map((c) => c.brandId)).size} brands</span>
      <span class="spacer"></span>
      <div class="seg" id="cre-filter">
        <button type="button" data-cb="all" aria-pressed="${CREATIVE_FILTER.brandId === 'all'}">All brands</button>
        ${BRANDS.filter((b) => CREATIVES.some((c) => c.brandId === b.id)).map((b) =>
          `<button type="button" data-cb="${b.id}" aria-pressed="${CREATIVE_FILTER.brandId === b.id}">${esc(b.name)}</button>`).join('')}
      </div>
    </div>
    <div class="panel-body" style="border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap">
      ${Object.keys(counts).map((k) => pill(`${k} ${counts[k]}`, VERDICT_TONE[k], VERDICT_GLYPH[k])).join(' ')}
      <span class="dim small" style="margin-left:auto">HOLD is the modal verdict by design — churning creative resets the ad set's learning phase, and the reset is paid for whether or not the change was right.</span>
    </div>
    <div class="panel-body tight">${cards || '<div class="panel-body dim">No creatives for this brand.</div>'}</div>
  </div>`;
}
function wireCreative() {
  $$('#cre-filter button').forEach((btn) => {
    btn.onclick = () => { CREATIVE_FILTER.brandId = btn.dataset.cb; draw('creative'); };
  });
}

/* ------------------------------------------------------------ 05 Learning */
const LEARN_STATE = { brandId:'nordhavn-supply' };
const ACT_LABEL = {
  acting:['acting on it','good'], watching:['watching','warn'], insufficient:['not enough data','neutral'],
  confounded:['confounded','warn'], nothing:['no effect found','neutral'],
};
const CLASS_LABEL = {
  safest_bet:'Safest bet', workhorse:'Workhorse', high_variance_bet:'High-variance bet',
  stop_generating:'Stop generating', insufficient_data:'Insufficient data',
};

function renderLearning() {
  const b = brandById(LEARN_STATE.brandId);
  const L = LEARNING[LEARN_STATE.brandId];
  const cur = brandCur(b);

  const findingRows = L.findings.map((f) => {
    const [lbl, tone] = ACT_LABEL[f.act];
    const dir = f.effect === 0 ? 'flat' : (f.effect < 0 ? 'down' : 'up');
    const eff = f.effect === 0 ? 'no effect' : `${f.effect > 0 ? '+' : ''}${Math.round(f.effect * 100)}%`;
    return `<tr>
      <td class="nowrap"><span class="mono small dim">${esc(f.dim)}</span><div style="font-weight:600">${esc(f.level)}</div></td>
      <td class="r"><span class="effect ${dir}">${eff}</span><div class="tiny dim">${f.effect === 0 ? 'on CPA' : 'CPA'}</div></td>
      <td class="r mono">${f.n}</td>
      <td class="r mono">${cur.symbol}${nf(f.spendMinor / cur.offset, 0)}</td>
      <td class="nowrap">
        <span class="conf-bar"><i style="width:${(f.conf * 100).toFixed(0)}%"></i><b style="left:85%"></b></span>
        <span class="mono small"> ${f.conf.toFixed(2)}</span>
      </td>
      <td class="nowrap">${pill(lbl, tone)}</td>
      <td class="small muted" style="min-width:34ch">${esc(f.note)}</td>
    </tr>`;
  }).join('');

  const A = L.angles;
  const withClass = A.rows.map((r) => {
    const perf = { angleId:r.id, creativesWithSpend:r.creativesWithSpend, winners:r.winners, midRange:r.midRange,
      losers:r.losers, spendUsd:r.spendUsd, accountCreativesWithSpend:A.accountCreativesWithSpend,
      accountSpendUsd:A.accountSpendUsd };
    return Object.assign({}, r, { cls:classifyAngle(perf), hit:hitRate(perf), sur:spendUseRatio(perf) });
  });
  const quadCell = (cls) => withClass.filter((r) => r.cls === cls).map((r) => `
    <span class="angle-tag">
      <b>${esc(r.statement)}</b>
      <div class="st">${esc(r.id)} · hit ${(r.hit * 100).toFixed(1)}% · SUR ${r.sur.toFixed(2)} · ${r.creativesWithSpend} creatives</div>
    </span>`).join('') || '<span class="tiny dim">empty</span>';
  const insufficient = withClass.filter((r) => r.cls === 'insufficient_data');

  const angleRows = withClass.map((r) => `
    <tr>
      <td><b>${esc(r.statement)}</b><div class="mono tiny dim">${esc(r.id)} · ${esc(r.anchorType)} anchor</div></td>
      <td class="nowrap">${pill(r.status, r.status === 'proven' ? 'good' : (r.status === 'retired' ? 'crit' : 'neutral'))}</td>
      <td class="r mono">${r.creativesWithSpend}</td>
      <td class="r mono">${r.winners}</td>
      <td class="r mono">${(r.hit * 100).toFixed(1)}%</td>
      <td class="r mono">${r.sur.toFixed(2)}</td>
      <td class="nowrap">${pill(CLASS_LABEL[r.cls], r.cls === 'safest_bet' ? 'good' : (r.cls === 'stop_generating' ? 'crit' : (r.cls === 'insufficient_data' ? 'neutral' : 'accent')))}</td>
      <td style="min-width:150px">
        <div class="meter"><i class="${r.coverage >= ANGLE_EXHAUSTION_COVERAGE ? 'crit' : ''}" style="width:${(r.coverage * 100).toFixed(0)}%"></i><b style="left:80%"></b></div>
        <div class="tiny dim">${(r.coverage * 100).toFixed(0)}% of its variant cells tried · retire at 80%</div>
      </td>
    </tr>`).join('');

  const ex = L.exploration;
  const interruptShort = ex.interrupt < INTERRUPT_EXPLORATION_FLOOR;

  return `
  <div class="screen-head">
    <h1>Learning</h1>
    <p class="lede">What the system believes about <b>${esc(b.name)}</b> — as attributes, not as a leaderboard of winning
      ads. A leaderboard tells you which file did well; an attribute finding tells you what to build next.</p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Brand</h2>
      <span class="spacer"></span>
      <div class="seg" id="learn-seg">
        ${Object.keys(LEARNING).map((id) => `<button type="button" data-lb="${id}" aria-pressed="${LEARN_STATE.brandId === id}">${esc(brandById(id).name)}</button>`).join('')}
      </div>
    </div>
    <div class="panel-body">
      <div class="grid-3">
        <div class="kpi"><div class="label">Creatives in the model</div><div class="v">${L.creativesInModel}</div>
          <div class="sub">${esc(L.window)}</div></div>
        <div class="kpi"><div class="label">Spend behind the findings</div>
          <div class="v">${cur.symbol}${nf(L.spendInModelMinor / cur.offset, 0)}</div>
          <div class="sub">Every finding below is paid for in real delivery</div></div>
        <div class="kpi"><div class="label">Acting on</div>
          <div class="v">${L.findings.filter((f) => f.act === 'acting').length} <small>of ${L.findings.length}</small></div>
          <div class="sub">The rest are visible but not steering generation</div></div>
      </div>
      <div class="note-block plain" style="margin-top:12px">${esc(L.attributionNote)}</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Attribute findings</h2>
      <span class="dim small">effect on CPA against the brand average, holding the rest of the vector as fixed as the data allows</span>
    </div>
    <div class="panel-body tight scroll-x">
      <table class="grid">
        <thead><tr><th>Attribute · level</th><th class="r">Effect</th><th class="r">Creatives</th><th class="r">Spend</th>
          <th>Confidence <span class="dim">(act at 0.85)</span></th><th>Status</th><th>What it means</th></tr></thead>
        <tbody>${findingRows}</tbody>
      </table>
    </div>
    <div class="panel-body" style="border-top:1px solid var(--border)">
      <div class="note-block">
        <b>Read the last three rows first.</b> A learning screen that only shows what worked is a marketing document. The
        confounded row cannot be separated from another attribute in the data it has; the insufficient row is below the
        10-creative floor at which a per-level estimate is worth acting on; and the no-effect row is a dimension the system
        has now stopped spending its exploration budget on. Those are findings too, and they are the ones that keep the
        confident rows honest.
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Angle portfolio</h2>
      <span class="dim small">hit rate against spend-use ratio — the two axes the bandit needs, kept apart on purpose</span>
    </div>
    <div class="panel-body">
      <div class="quad">
        <div></div>
        <div class="axis-x label">Low spend-use ratio (≤ 1.00)</div>
        <div class="axis-x label">High spend-use ratio (&gt; 1.00)</div>

        <div class="axis-y label">High hit rate<br>(≥ 8%)</div>
        <div class="cell"><h5>Workhorse</h5>${quadCell('workhorse')}</div>
        <div class="cell hi"><h5>Safest bet</h5>${quadCell('safest_bet')}</div>

        <div class="axis-y label">Low hit rate<br>(&lt; 8%)</div>
        <div class="cell lo"><h5>Stop generating</h5>${quadCell('stop_generating')}</div>
        <div class="cell"><h5>High-variance bet</h5>${quadCell('high_variance_bet')}</div>
      </div>
      <div class="note-block" style="margin-top:12px">
        Low hit rate with a high spend-use ratio is <b>not</b> a loser. It is an angle whose winners are rare and large, and
        it gets a small fixed slot the bandit is not allowed to starve. Collapsing these two axes into one score is exactly
        how that distinction disappears — which is why there are two axes and not a ranking.
      </div>
      ${insufficient.length ? `<div class="note-block plain" style="margin-top:10px">
        <b>Unclassified:</b> ${insufficient.map((r) => `${esc(r.statement)} (${r.creativesWithSpend} creatives)`).join('; ')} —
        under the ${MIN_CREATIVES_FOR_ANGLE_CLASSIFICATION}-creative floor, so the classifier refuses rather than guessing.
        An estimate here would be an allocation decision made on noise.
      </div>` : ''}
    </div>
    <div class="panel-body tight scroll-x" style="border-top:1px solid var(--border)">
      <table class="grid">
        <thead><tr><th>Angle</th><th>Status</th><th class="r">Creatives</th><th class="r">Winners</th>
          <th class="r">Hit rate</th><th class="r">SUR</th><th>Class</th><th>Variant space</th></tr></thead>
        <tbody>${angleRows}</tbody>
      </table>
    </div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h2>Exploration budget</h2><span class="dim small">where the next creatives are going</span></div>
      <div class="panel-body">
        ${[['promotional','Promotional cluster'],['interrupt','Interrupt cluster'],['unclustered','Unclustered tactics']].map(([k, lbl]) => `
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px">
              <span>${lbl}</span><span class="mono">${(ex[k] * 100).toFixed(0)}%</span>
            </div>
            <div class="meter" style="margin-top:4px">
              <i class="${k === 'interrupt' && interruptShort ? 'crit' : ''}" style="width:${(ex[k] * 100).toFixed(0)}%"></i>
              ${k === 'interrupt' ? '<b style="left:20%"></b>' : ''}
            </div>
          </div>`).join('')}
        <div class="${interruptShort ? 'note-block' : 'note-block plain'}">
          The interrupt cluster has a hard floor of ${Math.round(INTERRUPT_EXPLORATION_FLOOR * 100)}% of exploration.
          Promotional tactics lead the published leaderboard on both hit rate and spend-use ratio, but the measurement
          window spanned Black Friday and the report says so itself. A greedy bandit would starve the interrupt cluster on
          a seasonal artefact, so it is not allowed to.
          ${interruptShort ? ` <b>Currently ${(ex.interrupt * 100).toFixed(0)}% — below the floor; the next two briefs are forced interrupt.</b>` : ''}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>What this changes next</h2></div>
      <div class="panel-body">
        <ul class="explain small">
          ${L.findings.filter((f) => f.act === 'acting').map((f) => `<li><span class="mono">${esc(f.dim)}=${esc(f.level)}</span> — ${f.effect < 0 ? 'weighted up' : 'suppressed'} in the next generation window.</li>`).join('')}
          ${withClass.filter((r) => r.cls === 'stop_generating').map((r) => `<li>Angle <span class="mono">${esc(r.id)}</span> is out of the rotation: ${r.creativesWithSpend} creatives, no winner, and it consumes less budget than its share — the two-axis test says stop.</li>`).join('')}
          ${withClass.filter((r) => r.coverage >= 0.6 && r.cls !== 'stop_generating').map((r) => `<li>Angle <span class="mono">${esc(r.id)}</span> has tried ${(r.coverage * 100).toFixed(0)}% of its variant cells. At 80% it retires whether or not it is still winning — an angle you have said every way is finished.</li>`).join('')}
        </ul>
      </div>
    </div>
  </div>`;
}
function wireLearning() {
  $$('#learn-seg button').forEach((btn) => {
    btn.onclick = () => { LEARN_STATE.brandId = btn.dataset.lb; draw('learning'); };
  });
}

/* ------------------------------------------------------------ app */
const SCREENS = {
  overview: { render:renderOverview },
  brands:   { render:renderBrands },
  funnel:   { render:renderFunnel, wire:wireFunnel },
  creative: { render:renderCreative, wire:wireCreative },
  learning: { render:renderLearning, wire:wireLearning },
};
let CURRENT = 'overview';

function draw(name) {
  const s = SCREENS[name];
  if (!s) return;
  const el = document.getElementById('screen-' + name);
  el.innerHTML = s.render();
  if (s.wire) s.wire();
}
function go(name, push) {
  if (!SCREENS[name]) name = 'overview';
  CURRENT = name;
  Object.keys(SCREENS).forEach((k) => { document.getElementById('screen-' + k).hidden = k !== name; });
  $$('.rail button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.nav === name)));
  draw(name);
  if (push !== false) {
    try { history.replaceState(null, '', '#' + name); } catch (e) { location.hash = name; }
  }
  window.scrollTo(0, 0);
}

/* theme */
(function theme() {
  const btn = document.getElementById('theme-btn');
  const order = ['system','light','dark'];
  let cur = 'system';
  try { cur = localStorage.getItem('sc-theme') || 'system'; } catch (e) { cur = 'system'; }
  function apply() {
    if (cur === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', cur);
    btn.textContent = 'Theme: ' + cur;
    try { localStorage.setItem('sc-theme', cur); } catch (e) { /* private mode */ }
  }
  btn.onclick = () => { cur = order[(order.indexOf(cur) + 1) % order.length]; apply(); };
  apply();
})();

/* clock */
(function clock() {
  const el = document.getElementById('clock');
  function tick() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    el.textContent = `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
  }
  tick(); setInterval(tick, 1000);
})();

$$('.rail button').forEach((b) => { b.onclick = () => go(b.dataset.nav); });
window.addEventListener('hashchange', () => go((location.hash || '#overview').slice(1), false));
go((location.hash || '#overview').slice(1), false);
</script>

</body>
