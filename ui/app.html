<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend Control Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  color-scheme: light;
  --bg:            #eef0f3;
  --surface:       #ffffff;
  --surface-2:     #f4f6f8;
  --surface-3:     #e4e8ec;
  --border:        #d3d9e0;
  --border-strong: #b0b9c4;
  --text:          #10151b;
  --text-2:        #4b5765;
  --text-3:        #78838f;
  --accent:        #1c4ed8;
  --accent-2:      #143a9e;
  --accent-fg:     #ffffff;
  --accent-soft:   #e3eafb;
  --good:          #0c7247;
  --good-soft:     #dcf1e6;
  --warn:          #8f5a04;
  --warn-soft:     #faeccd;
  --crit:          #b01e2d;
  --crit-soft:     #fbe1e3;
  --neutral:       #5a6673;
  --neutral-soft:  #e7eaee;
  --shadow:        0 1px 2px rgba(16,21,27,.07), 0 1px 1px rgba(16,21,27,.04);
  --shadow-lift:   0 2px 6px rgba(16,21,27,.10), 0 1px 2px rgba(16,21,27,.06);
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:            #0d1116;
    --surface:       #151a21;
    --surface-2:     #1b212a;
    --surface-3:     #232b35;
    --border:        #2a323d;
    --border-strong: #3d4855;
    --text:          #e8edf3;
    --text-2:        #a6b1be;
    --text-3:        #78838f;
    --accent:        #7ba3ff;
    --accent-2:      #a7c1ff;
    --accent-fg:     #0b1017;
    --accent-soft:   #17253d;
    --good:          #46c68c;
    --good-soft:     #10291f;
    --warn:          #e2ab4c;
    --warn-soft:     #2b2213;
    --crit:          #ff6f77;
    --crit-soft:     #331519;
    --neutral:       #98a3af;
    --neutral-soft:  #212832;
    --shadow:        0 1px 2px rgba(0,0,0,.45);
    --shadow-lift:   0 3px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:            #0d1116;
  --surface:       #151a21;
  --surface-2:     #1b212a;
  --surface-3:     #232b35;
  --border:        #2a323d;
  --border-strong: #3d4855;
  --text:          #e8edf3;
  --text-2:        #a6b1be;
  --text-3:        #78838f;
  --accent:        #7ba3ff;
  --accent-2:      #a7c1ff;
  --accent-fg:     #0b1017;
  --accent-soft:   #17253d;
  --good:          #46c68c;
  --good-soft:     #10291f;
  --warn:          #e2ab4c;
  --warn-soft:     #2b2213;
  --crit:          #ff6f77;
  --crit-soft:     #331519;
  --neutral:       #98a3af;
  --neutral-soft:  #212832;
  --shadow:        0 1px 2px rgba(0,0,0,.45);
  --shadow-lift:   0 3px 10px rgba(0,0,0,.5);
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.012em; }
p { margin: 0 0 8px; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-3);
}
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.small { font-size: 12px; }
.tiny { font-size: 11.5px; }
hr.rule { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

/* ------------------------------------------------------------------ chrome */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 9px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brandmark { display: flex; align-items: baseline; gap: 9px; }
.brandmark .bm-1 {
  font-family: var(--mono); font-weight: 600; font-size: 13px;
  letter-spacing: .10em; text-transform: uppercase;
}
.brandmark .bm-2 { font-size: 11.5px; color: var(--text-3); letter-spacing: .02em; }
.demo-flag {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 3px 9px; border-radius: 3px;
  background: var(--warn-soft); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  font-size: 11.5px; font-weight: 500;
}
.demo-flag b { font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 10.5px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.mode-chip {
  font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 3px;
  border: 1px solid var(--border); color: var(--text-2); background: var(--surface-2);
}

button, select, input { font-family: inherit; font-size: inherit; color: inherit; }
.btn {
  appearance: none; cursor: pointer;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 4px 10px; font-size: 12px; font-weight: 500;
  box-shadow: var(--shadow);
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--surface-2); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 216px minmax(0,1fr); align-items: start; }
.rail {
  position: sticky; top: 47px; align-self: start;
  height: calc(100vh - 47px); overflow-y: auto;
  padding: 16px 12px 20px;
  border-right: 1px solid var(--border);
  background: var(--surface);
}
.rail .label { padding: 0 8px 8px; }
.rail button {
  display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline;
  width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-left: 2px solid transparent;
  padding: 7px 8px; margin-bottom: 1px; border-radius: 0 4px 4px 0;
  color: var(--text-2); font-size: 13px; font-weight: 500;
  transition: background .12s, color .12s;
}
.rail button .ix { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.rail button:hover { background: var(--surface-2); color: var(--text); }
.rail button[aria-current="true"] {
  background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent);
}
.rail button[aria-current="true"] .ix { color: var(--accent); }
.rail .rail-note {
  margin-top: 18px; padding: 10px 8px 0; border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-3); line-height: 1.45;
}
main { padding: 20px 22px 64px; min-width: 0; }
.screen[hidden] { display: none; }
.screen-head { margin-bottom: 16px; max-width: 76ch; }
.screen-head h1 { font-size: 20px; letter-spacing: -0.02em; }
.screen-head .lede { color: var(--text-2); margin-top: 4px; font-size: 13px; }

/* ------------------------------------------------------------------ panels */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.panel-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.panel-head h2 { font-size: 13.5px; }
.panel-head .spacer { margin-left: auto; }
.panel-body { padding: 14px; }
.panel-body.tight { padding: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px,1fr)); gap: 16px; }
.funnel-layout { display: grid; grid-template-columns: 340px minmax(0,1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .funnel-layout { grid-template-columns: minmax(0,1fr); } }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 12px; }

/* ------------------------------------------------------------------ pills */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px; border-radius: 3px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid transparent; white-space: nowrap;
}
.pill.good    { background: var(--good-soft);    color: var(--good);    border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.pill.warn    { background: var(--warn-soft);    color: var(--warn);    border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.pill.crit    { background: var(--crit-soft);    color: var(--crit);    border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.pill.accent  { background: var(--accent-soft);  color: var(--accent);  border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.pill.neutral { background: var(--neutral-soft); color: var(--neutral); border-color: var(--border); }
.pill .glyph { font-family: var(--mono); font-size: 11px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; margin: 0 4px 4px 0; border-radius: 3px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-2); white-space: nowrap;
}
.chip .k { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.chip .v { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
.chip.incl { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); color: var(--accent); }
.chip.incl .v { color: var(--accent); }
.chip.excl { border-color: color-mix(in srgb, var(--crit) 35%, transparent); background: var(--crit-soft); color: var(--crit); }
.chip.excl .v { color: var(--crit); }
.chip.sugg { border-style: dashed; }

/* ------------------------------------------------------------------ tables */
.scroll-x { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th {
  text-align: left; padding: 8px 12px; white-space: nowrap;
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--surface-2);
  position: sticky; top: 0;
}
table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.r, table.grid th.r { text-align: right; }
table.grid tbody tr:hover td { background: var(--surface-2); }
table.grid td.nowrap { white-space: nowrap; }

/* ------------------------------------------------------------------ meters */
.meter { position: relative; height: 7px; background: var(--surface-3); border-radius: 2px; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--accent); }
.meter > i.good { background: var(--good); }
.meter > i.warn { background: var(--warn); }
.meter > i.crit { background: var(--crit); }
.meter > b { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--text-3); }
.meter > b.dash { background: repeating-linear-gradient(to bottom, var(--text-3) 0 2px, transparent 2px 4px); }
.meter-legend { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; color: var(--text-3); }

/* ------------------------------------------------------------------ escalations */
.esc { border-top: 1px solid var(--border); }
.esc:first-child { border-top: 0; }
.esc-row {
  display: grid; grid-template-columns: 4px minmax(0,1fr); gap: 0;
}
.esc-stripe { background: var(--sev); }
.esc-main { padding: 12px 14px; min-width: 0; }
.esc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.esc-title { font-weight: 600; font-size: 13.5px; }
.esc-meta { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
.esc-detail { color: var(--text-2); max-width: 92ch; }
.esc-ask {
  margin-top: 7px; padding: 7px 10px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12.5px;
}
.esc-ask .label { display: block; margin-bottom: 2px; }
.esc-foot { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ kpis */
.kpi { padding: 12px 14px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); }
.kpi .v { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--text-3); }
.kpi .sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.kpi.is-crit { border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: var(--crit-soft); }
.kpi.is-crit .v { color: var(--crit); }

/* ------------------------------------------------------------------ controls */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  cursor: pointer; padding: 5px 10px; border-radius: 4px; font-size: 12.5px; font-weight: 500;
  background: var(--surface); color: var(--text-2);
  border: 1px solid var(--border); transition: all .12s;
}
.seg button:hover { border-color: var(--accent); color: var(--text); }
.seg button[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
}
.field { margin-bottom: 14px; }
.field > .label { display: block; margin-bottom: 6px; }
.field .hint { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
input[type="number"], select {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 5px 8px; font-variant-numeric: tabular-nums;
}
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px; background: var(--surface-3); border: 1px solid var(--border);
}
input[type="range"]::-moz-range-track {
  height: 6px; border-radius: 3px; background: var(--surface-3); border: 1px solid var(--border);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -6px;
  width: 17px; height: 17px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface); box-shadow: var(--shadow-lift);
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface); box-shadow: var(--shadow-lift);
}
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.budget-readout { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.checkline { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }

/* ------------------------------------------------------------------ verdict banner */
.banner {
  display: grid; grid-template-columns: 5px 1fr; border-radius: 5px; overflow: hidden;
  border: 1px solid var(--bd); background: var(--bgc); margin-bottom: 14px;
}
.banner .bar { background: var(--sev); }
.banner .body { padding: 11px 14px; }
.banner h3 { font-size: 14.5px; margin-bottom: 3px; }
.banner p { color: var(--text-2); margin: 0; }
.banner.good { --sev: var(--good); --bd: color-mix(in srgb, var(--good) 35%, transparent); --bgc: var(--good-soft); }
.banner.warn { --sev: var(--warn); --bd: color-mix(in srgb, var(--warn) 35%, transparent); --bgc: var(--warn-soft); }
.banner.crit { --sev: var(--crit); --bd: color-mix(in srgb, var(--crit) 35%, transparent); --bgc: var(--crit-soft); }
.banner.good h3 { color: var(--good); }
.banner.warn h3 { color: var(--warn); }
.banner.crit h3 { color: var(--crit); }

/* ------------------------------------------------------------------ funnel flow */
.flow { display: flex; flex-direction: column; gap: 0; }
.stage {
  min-width: 0;
  border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2);
  padding: 11px 12px;
}
.stage.is-bad { border-color: color-mix(in srgb, var(--crit) 55%, transparent); background: var(--crit-soft); }
.stage-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
.stage-body { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .stage-body { grid-template-columns: minmax(0,1fr); } }
.stage h4 { font-size: 13px; }
.tuple {
  font-family: var(--mono); font-size: 11px; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
  padding: 6px 8px; margin: 7px 0; line-height: 1.6; word-break: break-word;
  white-space: pre-wrap; overflow-x: auto;
}
.flow-arrow {
  height: 22px; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-family: var(--mono); font-size: 15px;
}
.flow-arrow::before { content: "\2193"; }
.aud-group { margin-top: 7px; }
.aud-group > .label { display: block; margin-bottom: 3px; }

/* ------------------------------------------------------------------ arithmetic */
.arith-bar { position: relative; height: 16px; background: var(--surface-3); border-radius: 2px; min-width: 130px; }
.arith-bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--good); }
.arith-bar > i.short { background: var(--crit); }
.arith-bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.arith-line {
  font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
  background: var(--surface-2); border-left: 2px solid var(--border-strong);
  padding: 5px 9px; margin: 4px 0; line-height: 1.5; word-break: break-word;
}
.explain li { margin-bottom: 6px; color: var(--text-2); }
.explain { margin: 0; padding-left: 18px; }

/* ------------------------------------------------------------------ creative */
.creative { border-top: 1px solid var(--border); padding: 14px; }
.creative:first-child { border-top: 0; }
.cre-top { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 8px; }
.cre-id { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.cre-grid { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); gap: 16px; }
.verdict-box {
  border: 1px solid var(--bd); background: var(--bgc); border-radius: 5px; padding: 10px 12px;
}
.verdict-box.SCALE      { --bd: color-mix(in srgb, var(--good) 40%, transparent); --bgc: var(--good-soft); --vc: var(--good); }
.verdict-box.KILL       { --bd: color-mix(in srgb, var(--crit) 40%, transparent); --bgc: var(--crit-soft); --vc: var(--crit); }
.verdict-box.ITERATE    { --bd: color-mix(in srgb, var(--warn) 40%, transparent); --bgc: var(--warn-soft); --vc: var(--warn); }
.verdict-box.HOLD       { --bd: var(--border); --bgc: var(--surface-2); --vc: var(--neutral); }
.verdict-box.EQUIVALENT { --bd: var(--border); --bgc: var(--surface-2); --vc: var(--neutral); }
.verdict-box.BLOCKED    { --bd: color-mix(in srgb, var(--crit) 40%, transparent); --bgc: var(--crit-soft); --vc: var(--crit); }
.verdict-plain { font-size: 13px; color: var(--text); }
.verdict-plain b { color: var(--vc); }
.raw-reason {
  font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
  padding: 7px 9px; margin-top: 8px; word-break: break-word;
}
.perf-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
.perf-row div .label { display: block; }
.perf-row div .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.finding { border-left: 3px solid var(--sev); padding: 6px 0 6px 9px; margin-bottom: 8px; }
.finding .fid { font-family: var(--mono); font-size: 11.5px; font-weight: 500; }

/* ------------------------------------------------------------------ learning */
.quad { display: grid; grid-template-columns: 90px 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 0; }
.quad .cell { border: 1px solid var(--border); padding: 10px; min-height: 128px; background: var(--surface-2); }
.quad .cell.hi { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.quad .cell.lo { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 25%, transparent); }
.quad .axis-y { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; }
.quad .axis-x { text-align: center; padding: 6px; }
.quad .cell h5 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; }
.angle-tag {
  display: block; background: var(--surface); border: 1px solid var(--border);
  border-radius: 3px; padding: 5px 7px; margin-bottom: 5px; font-size: 12px;
}

<script>
"use strict";
/* =====================================================================
   The funnel arithmetic, ported line-for-line from src/funnel/templates.ts.
   This is the honest bit: the same numbers the publisher would use.
   ===================================================================== */
const round2 = (n) => Math.round(n * 100) / 100;
const round1 = (n) => Math.round(n * 10) / 10;
const pctS = (share) => `${Math.round(share * 100)}%`;
let CUR = { code:'USD', symbol:'$', offset:100 };
const CURRENCIES = { USD:{symbol:'$',offset:100}, GBP:{symbol:'£',offset:100}, EUR:{symbol:'€',offset:100} };
function money(n, cur) {
  const c = cur || CUR;
  if (n === undefined || n === null || Number.isNaN(n)) return 'n/a';
  return `${c.symbol}${round2(n).toFixed(2)}`;
}
function moneyMinor(minor, cur) { const c = cur || CUR; return money(minor / c.offset, c); }

function primaryRungFor(a) {
  switch (a) {
    case 'website_purchase': case 'catalog_sales': return 'purchase';
    case 'website_lead': case 'instant_form_lead': case 'messenger_lead':
    case 'whatsapp_conversation': case 'phone_call': return 'lead';
    case 'app_install': return 'app_install';
    default: return 'landing_page_view';
  }
}
function ladderFor(a) {
  const p = primaryRungFor(a);
  if (p === 'purchase') return CONVERSION_LADDER;
  if (p === 'lead') return LEAD_LADDER;
  if (p === 'app_install') return APP_LADDER;
  return TRAFFIC_LADDER;
}
function oneRungCheaper(rung, ladder) {
  const i = ladder.indexOf(rung);
  if (i < 0 || i + 1 >= ladder.length) return rung;
  return ladder[i + 1];
}
function cpeFor(rung, input) {
  const spec = RUNGS[rung];
  const override = input.cpeOverridesMajor ? input.cpeOverridesMajor[rung] : undefined;
  if (override !== undefined) return override;
  if (spec.costBasis === 'none') return undefined;
  if (spec.costBasis === 'brand_cpa') return input.targetCpaMajor !== undefined ? input.targetCpaMajor : spec.benchmarkCpeMajor;
  return spec.benchmarkCpeMajor;
}
const floorDailyFor = (cpe) => (cpe === undefined ? undefined : round2(LEARNING_DAILY_MULTIPLE * cpe));

function chooseRungByLadder(from, ladder, stageDaily, input) {
  const start = Math.max(0, ladder.indexOf(from));
  let last = from;
  for (let i = start; i < ladder.length; i += 1) {
    const rung = ladder[i];
    last = rung;
    const floor = floorDailyFor(cpeFor(rung, input));
    if (floor === undefined || stageDaily >= floor) return rung;
  }
  return last;
}

function assessStage(s, ctx) {
  const stageDaily = round2(ctx.total * s.budgetShare);
  let preferred, rung;
  switch (s.rungMode) {
    case 'fixed':      preferred = s.fixedRung || ctx.primary; rung = preferred; break;
    case 'primary':    preferred = ctx.primary; rung = preferred; break;
    case 'one_cheaper':preferred = oneRungCheaper(ctx.anchor, ctx.ladder); rung = preferred; break;
    default:           preferred = ctx.primary; rung = chooseRungByLadder(ctx.primary, ctx.ladder, stageDaily, ctx.input);
  }
  const cpe = cpeFor(rung, ctx.input);
  const floor = floorDailyFor(cpe);
  const eventLimited = cpe !== undefined;
  const affordable = cpe === undefined ? undefined : round1((stageDaily * 7) / cpe);
  const exits = floor === undefined || stageDaily >= floor;
  const implied = floor === undefined ? undefined : round2(floor / s.budgetShare);

  const rungIndex = ctx.ladder.indexOf(rung);
  const minIndex = ctx.ladder.indexOf(s.minimumRung);
  const degraded = rungIndex >= 0 && minIndex >= 0 && rungIndex > minIndex;

  let problem;
  if (degraded) {
    const minCpe = cpeFor(s.minimumRung, ctx.input);
    const minFloor = floorDailyFor(minCpe);
    const minAffordable = minCpe === undefined ? undefined : round1((stageDaily * 7) / minCpe);
    problem = `"${s.label}" would have to drop to ${RUNGS[rung].label} to clear the learning phase, but it stops ` +
      `doing its job below ${RUNGS[s.minimumRung].label}. At ${RUNGS[s.minimumRung].label} ` +
      `(${money(minCpe)} each) it needs ${money(minFloor)}/day of its own; ${pctS(s.budgetShare)} of ` +
      `${money(ctx.total)}/day gives it ${money(stageDaily)}/day, which buys ${minAffordable === undefined ? '?' : minAffordable} events ` +
      `a week against the ${LEARNING_PHASE_EVENTS_PER_WEEK} it needs — ` +
      `${round1(LEARNING_PHASE_EVENTS_PER_WEEK - (minAffordable || 0))} short.`;
  } else if (!exits) {
    problem = `"${s.label}" cannot exit the learning phase. Optimising for ${RUNGS[rung].label} at ${money(cpe)} ` +
      `each, it needs ${money(floor)}/day; ${pctS(s.budgetShare)} of ${money(ctx.total)}/day gives it ` +
      `${money(stageDaily)}/day, which buys ${affordable === undefined ? '?' : affordable} events a week against the ` +
      `${LEARNING_PHASE_EVENTS_PER_WEEK} it needs — ${round1(LEARNING_PHASE_EVENTS_PER_WEEK - (affordable || 0))} short.`;
  }

  const arithmetic = eventLimited
    ? `${money(stageDaily)}/day x 7 / ${money(cpe)} per ${RUNGS[rung].label} = ${affordable === undefined ? '?' : affordable} events/week ` +
      `vs ${LEARNING_PHASE_EVENTS_PER_WEEK} needed (floor ${money(floor)}/day = ${LEARNING_PHASE_EVENTS_PER_WEEK}/7 x ${money(cpe)})`
    : `${money(stageDaily)}/day, ${RUNGS[rung].label} — not event-limited, so no learning-phase floor applies.`;

  return { stageId:s.id, label:s.label, role:s.role, budgetShare:s.budgetShare, stageDailyMajor:stageDaily,
    rung, rungLabel:RUNGS[rung].label, preferredRung:preferred, minimumRung:s.minimumRung,
    laddered: rung !== preferred, eventLimited, costPerEventMajor:cpe,
    eventsNeededPerWeek:LEARNING_PHASE_EVENTS_PER_WEEK, eventsAffordablePerWeek:affordable,
    stageFloorDailyMajor:floor, shortfallDailyMajor: floor === undefined ? 0 : round2(Math.max(0, floor - stageDaily)),
    exitsLearning:exits, impliedTotalDailyMajor:implied, arithmetic, problem };
}

function buildExplanation(e) {
  const lines = [];
  lines.push(`Meta's delivery system needs about ${LEARNING_PHASE_EVENTS_PER_WEEK} optimisation events per ad set ` +
    `per week before it stops experimenting, so each ad set needs roughly ${round2(LEARNING_DAILY_MULTIPLE)} x its own cost per event, per day.`);
  for (const s of e.stages) lines.push(`${s.label}: ${s.arithmetic}`);
  if (e.verdict === 'refuse') {
    for (const s of e.failing) if (s.problem !== undefined) lines.push(s.problem);
    if (e.required > e.total) {
      lines.push(`${e.template.name} needs about ${money(e.required)}/day in total for every stage to clear its own ` +
        `floor. You have ${money(e.total)}/day — ${money(e.required - e.total)}/day short.`);
    }
    if (e.required > e.template.declaredMinViableDailyMajor) {
      lines.push(`Note: the playbook figure for ${e.template.name} is ${money(e.template.declaredMinViableDailyMajor)}/day, ` +
        `but at this brand's cost per conversion the arithmetic gives ${money(e.required)}/day. The playbook figure ` +
        `assumes a cheaper conversion than this brand has.`);
    }
    if (e.fallback !== undefined) {
      lines.push(`Recommendation: ${FUNNEL_TEMPLATES[e.fallback].name}. ` + (e.fallback === 'single_engine'
        ? `One campaign, one ad set, all ${money(e.total)}/day in one place — which is also the structure where the ` +
          `algorithm does the retargeting internally, measured at 25–45% of a broad ad set's budget.`
        : `Fewer stages, each with enough budget to be a real ad set.`));
    } else {
      lines.push(`There is no simpler structure to fall back to — this is already one campaign with one ad set. At ` +
        `${money(e.total)}/day the honest answer is that no Meta ad set will exit the learning phase for this ` +
        `conversion. Either raise the budget to ${money(e.required)}/day or accept that delivery will stay unstable.`);
    }
  } else {
    for (const s of e.stages.filter((x) => x.laddered)) {
      lines.push(`${s.label} will optimise for ${s.rungLabel}, not ${RUNGS[s.preferredRung].label}: at ` +
        `${money(s.stageDailyMajor)}/day a ${RUNGS[s.preferredRung].label}-optimised ad set would need ` +
        `${money(floorDailyFor(cpeFor(s.preferredRung, e.input)))}/day. Step it up a rung whenever the current one ` +
        `clears ${LEARNING_PHASE_EVENTS_PER_WEEK}/week for two consecutive weeks.`);
    }
    lines.push(`At ${money(e.total)}/day this account can support about ${e.maxSupportableAdSets} ad set(s) at its ` +
      `most expensive optimisation event without any of them being learning-limited.`);
  }
  return lines;
}

function assessFunnelBudget(templateId, input) {
  const template = FUNNEL_TEMPLATES[templateId];
  const total = input.dailyBudgetMajor;
  const currency = (input.currency || 'USD').toUpperCase();
  const ladder = ladderFor(input.archetype);
  const primary = primaryRungFor(input.archetype);

  let anchor = primary;
  const ladderStage = template.stages.find((s) => s.rungMode === 'ladder');
  if (ladderStage !== undefined) {
    anchor = chooseRungByLadder(primary, ladder, total * ladderStage.budgetShare, input);
  }
  const stages = template.stages.map((s) => assessStage(s, { total, input, ladder, primary, anchor }));
  const failing = stages.filter((s) => s.problem !== undefined);
  const eventLimited = stages.filter((s) => s.eventLimited && s.impliedTotalDailyMajor !== undefined);
  const required = eventLimited.length === 0 ? 0 : round2(Math.max.apply(null, eventLimited.map((s) => s.impliedTotalDailyMajor)));
  const binding = eventLimited.slice().sort((a, b) => b.impliedTotalDailyMajor - a.impliedTotalDailyMajor)[0];
  const maxCpe = Math.max.apply(null, [0].concat(stages.map((s) => (s.eventLimited ? (s.costPerEventMajor || 0) : 0))));
  const maxSupportableAdSets = maxCpe > 0 ? Math.floor(total / (LEARNING_DAILY_MULTIPLE * maxCpe)) : template.stages.length;
  const verdict = failing.length === 0 ? 'build' : 'refuse';
  const fallback = verdict === 'refuse' ? DOWNGRADE_PATH[templateId] : undefined;
  const explanation = buildExplanation({ template, stages, failing, total, required, verdict, fallback, maxSupportableAdSets, input });

  return { templateId, templateName:template.name, verdict, dailyBudgetMajor:total, currency,
    benchmarksApproximate: currency !== 'USD', stages, failingStageIds: failing.map((s) => s.stageId),
    bindingStageId: binding ? binding.stageId : undefined, requiredDailyMajor: required,
    shortfallDailyMajor: round2(Math.max(0, required - total)),
    declaredMinViableDailyMajor: template.declaredMinViableDailyMajor, maxSupportableAdSets,
    fallbackTemplateId: fallback, explanation };
}

function recommendFunnel(inputs) {
  const considered = [];
  const notes = [];
  const budget = inputs.dailyBudgetMajor;
  const budgetInput = { dailyBudgetMajor:budget, archetype:inputs.archetype, currency:inputs.currency };
  if (inputs.targetCpaMajor !== undefined) budgetInput.targetCpaMajor = inputs.targetCpaMajor;

  let candidate;
  if (inputs.purchasesLast180d === 0 && !inputs.hasCustomerList) {
    candidate = budget >= FUNNEL_TEMPLATES.seed_and_harvest.declaredMinViableDailyMajor ? 'seed_and_harvest' : 'single_engine';
    notes.push(candidate === 'seed_and_harvest'
      ? 'No conversion history and no customer list: Meta has nothing to learn from, which is the one situation where buying first-party signal is worth its own campaign.'
      : `No conversion history, and under ${money(FUNNEL_TEMPLATES.seed_and_harvest.declaredMinViableDailyMajor)}/day the seed pool never reaches 1,000 people, so the seed campaign would be paying for nothing.`);
  } else if (budget < 50) {
    candidate = 'single_engine';
    notes.push(`Under $50/day a second ad set takes budget away from the one that converts without being able to reach its own floor. Meta's own consolidation guidance says the same thing from the other direction: "when you run too many ad sets at the same time, each one gets fewer opportunities to learn".`);
  } else if (inputs.warmPoolSize < AUDIENCE_DELIVERY_FLOOR) {
    candidate = 'single_engine';
    notes.push(`The 30-day warm pool holds ${inputs.warmPoolSize} people, ${AUDIENCE_DELIVERY_FLOOR - inputs.warmPoolSize} short of the ${AUDIENCE_DELIVERY_FLOOR} at which Meta delivers reliably. A recapture stage would have nobody in it. It will be added automatically once the pool gets there.`);
  } else if (inputs.purchasesLast180d >= FUNNEL_TEMPLATES.value_ladder.requiresPurchaseHistory && inputs.hasCustomerList
             && inputs.valueSpreadMaterial === true && budget >= FUNNEL_TEMPLATES.value_ladder.declaredMinViableDailyMajor) {
    candidate = 'value_ladder';
    notes.push('Real purchase history plus a value spread: the only seed whose behaviour is the behaviour you want.');
  } else if (budget >= FUNNEL_TEMPLATES.full_three_stage.declaredMinViableDailyMajor) {
    candidate = 'full_three_stage';
  } else {
    candidate = 'broad_plus_recapture';
  }

  let current = candidate;
  let assessment = assessFunnelBudget(current, budgetInput);
  const guard = new Set();
  while (assessment.verdict === 'refuse' && !guard.has(current)) {
    guard.add(current);
    considered.push({ templateId:current, verdict:'refuse',
      why: assessment.explanation.filter((l) => l.indexOf('short') >= 0 || l.indexOf('Recommendation') === 0).join(' ') });
    const next = DOWNGRADE_PATH[current];
    if (next === undefined) break;
    current = next;
    assessment = assessFunnelBudget(current, budgetInput);
  }
  considered.push({ templateId:current, verdict:assessment.verdict,
    why: assessment.verdict === 'build'
      ? `Every stage clears its own learning-phase floor at ${money(budget)}/day.`
      : `Even this structure cannot clear the floor at ${money(budget)}/day.` });

  return { templateId:current, template:FUNNEL_TEMPLATES[current], assessment, considered, notes };
}

function validateSpecLite(spec) {
  const DEST = {
    OUTCOME_AWARENESS:['UNDEFINED','WEBSITE','MESSENGER','WHATSAPP','INSTAGRAM_DIRECT'],
    OUTCOME_TRAFFIC:['UNDEFINED','MESSENGER','WHATSAPP','PHONE_CALL'],
    OUTCOME_ENGAGEMENT:['UNDEFINED','MESSENGER','WHATSAPP','PHONE_CALL','INSTAGRAM_DIRECT','ON_POST','ON_EVENT','ON_VIDEO','ON_PAGE'],
    OUTCOME_LEADS:['ON_AD','LEAD_FROM_MESSENGER','LEAD_FROM_IG_DIRECT','PHONE_CALL','UNDEFINED','WEBSITE','APP'],
    OUTCOME_SALES:['WEBSITE','MESSENGER','PHONE_CALL'],
    OUTCOME_APP_PROMOTION:['UNDEFINED'],
  };
  if (spec.destinationType === undefined) return undefined;
  return DEST[spec.objective].indexOf(spec.destinationType) >= 0 ? undefined
    : `destination_type=${spec.destinationType} is not available for ${spec.objective}.`;
}
function resolveStageSpec(stage, brandArchetype) {
  const base = ARCHETYPES[stage.archetype === 'brand' ? brandArchetype : stage.archetype];
  const o = stage.optimisation;
  if (o === undefined) return base;
  const derived = { archetype:base.archetype, objective:o.objective, optimizationGoal:o.optimizationGoal,
    billingEvent:o.billingEvent, promotedObject:o.promotedObject, confidence:'inferred',
    note:`Funnel stage "${stage.id}" overrides the ${base.archetype} tuple with ${o.objective}/${o.optimizationGoal}/${o.billingEvent} and omits destination_type. ${o.note}` };
  if (o.destinationType !== undefined) derived.destinationType = o.destinationType;
  return derived;
}
function splitMinor(totalMinor, shares) {
  const raw = shares.map((s) => Math.floor(totalMinor * s));
  let remainder = totalMinor - raw.reduce((a, b) => a + b, 0);
  if (remainder === 0 || raw.length === 0) return raw;
  const order = shares.map((s, i) => ({ s, i })).sort((a, b) => b.s - a.s).map((x) => x.i);
  let k = 0;
  while (remainder > 0) { const idx = order[k % order.length]; raw[idx] += 1; remainder -= 1; k += 1; }
  return raw;
}
function resolveEasyOptions(o) {
  const offset = o.currencyOffset || 100;
  const budgetMajor = o.dailyBudgetMinor / offset;
  const archetype = EASY_GOAL_ARCHETYPE[o.goal];
  const warnings = [];
  const purchases = o.purchasesLast180d !== undefined ? o.purchasesLast180d : (o.assets === 'customers' ? 100 : 0);
  if (o.purchasesLast180d === undefined) {
    warnings.push(`purchasesLast180d was not supplied; assumed ${purchases} from "${EASY_ASSETS_LABEL[o.assets]}". Read it from Insights before publishing — the template choice turns on it.`);
  }
  const warmDefaults = { nothing:0, video_views:0, website_traffic:AUDIENCE_DELIVERY_FLOOR, customers:AUDIENCE_DELIVERY_FLOOR };
  const warmPool = o.warmPoolSize !== undefined ? o.warmPoolSize : warmDefaults[o.assets];
  if (o.warmPoolSize === undefined) {
    warnings.push(`warmPoolSize was not supplied; assumed ${warmPool} from "${EASY_ASSETS_LABEL[o.assets]}". This is the number that decides whether a recapture stage has anybody in it — measure it, do not assume it.`);
  }
  const recommendation = recommendFunnel({
    dailyBudgetMajor:budgetMajor, archetype, purchasesLast180d:purchases, warmPoolSize:warmPool,
    hasCustomerList: o.assets === 'customers', currency:o.currency,
    targetCpaMajor: o.targetCpaMinor !== undefined ? o.targetCpaMinor / offset : undefined,
    valueSpreadMaterial: o.valueSpreadMaterial,
  });
  const template = recommendation.template;
  const assessment = recommendation.assessment;
  const minorBudgets = splitMinor(o.dailyBudgetMinor, template.stages.map((s) => s.budgetShare));
  const stages = template.stages.map((s, i) => ({
    stage:s, spec:resolveStageSpec(s, archetype), dailyBudgetMinor:minorBudgets[i],
    arithmetic: assessment.stages.find((a) => a.stageId === s.id),
    targetPools: s.target.map((p) => AUDIENCE_POOLS[p]),
    suggestPools: s.suggest.map((p) => AUDIENCE_POOLS[p]),
    excludePools: s.exclude.map((p) => AUDIENCE_POOLS[p]),
  }));
  const audiencesToBuild = template.audiences.map((p) => AUDIENCE_POOLS[p]);
  for (const pool of audiencesToBuild) {
    if (pool.undocumentedRule) {
      warnings.push(`"${pool.label}" is built with the video-engagement rule Meta no longer documents. Probe it against a hand-created audience before relying on it; the lookalike route via campaign conversions is the documented alternative.`);
    }
  }
  if (assessment.benchmarksApproximate) {
    warnings.push(`Cost-per-event benchmarks are tier-1 US figures applied to a ${o.currency} account. Replace them with observed costs from Insights before treating the floors as exact.`);
  }
  return { templateId:recommendation.templateId, template, archetype, stages, assessment, recommendation,
    audiencesToBuild, refusal: assessment.verdict === 'refuse' ? assessment.explanation.join(' ') : undefined, warnings };
}

/* classifyAngle, from src/domain/genome.ts */
const hitRate = (p) => p.winners / p.creativesWithSpend;
const spendUseRatio = (p) => (p.spendUsd / p.accountSpendUsd) / (p.creativesWithSpend / p.accountCreativesWithSpend);
function classifyAngle(p) {
  if (p.creativesWithSpend < MIN_CREATIVES_FOR_ANGLE_CLASSIFICATION) return 'insufficient_data';
  const highHit = hitRate(p) >= HIT_RATE_REFERENCE;
  const highSur = spendUseRatio(p) > SPEND_USE_RATIO_REFERENCE;
  if (highHit && highSur) return 'safest_bet';
  if (highHit) return 'workhorse';
  if (highSur) return 'high_variance_bet';
  return 'stop_generating';
}
